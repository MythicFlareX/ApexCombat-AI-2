# Memory for gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric properties (from the official fabric-example-mod, 1.21.11 branch)
minecraft_version=1.21.11
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
