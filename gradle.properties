# open https://fabricmc.net/develop/ , pick 1.21.11 and copy the "Yarn Mappings" version here.
yarn_mappings=1.21.11+build.3

# Mod properties
version=1.0.0
group=dev.autopvp
archives_base_name=autopvp

# Dependencies
fabric_api_version=0.141.6+1.21.11
